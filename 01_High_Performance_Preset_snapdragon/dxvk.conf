# ============================================================
# WINLATOR CONFIG - SNAPDRAGON / ADRENO [HIGH PERFORMANCE]
# Target: Heavy PC Games (High FPS & Async Rendering)
# Optimized for: Snapdragon 8 Gen 1 / Gen 2 / Gen 3 / 888
# ============================================================

dxvk.enableAsync = True
dxvk.hud = compiler
dxvk.allowMemorySwapping = True
dxvk.maxChunkSize = 512
dxvk.numCompilerThreads = 8
d3d11.maxTessellationFactor = 8
dxvk.gpus = Adreno
dxvk.useEarlyZ = True
dxvk.pipeCompilerThreads = 8
