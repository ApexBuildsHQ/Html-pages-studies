# ============================================================
# CONTAINER SETTINGS - HIGH PERFORMANCE PRESET (MALI)
# ============================================================

[Container]
screen_size = 1280x720
graphics_driver = VirGL
dxvk_version = 2.3
audio_driver = ALSA
cpu_affinity = 0,1,2,3,4,5,6,7
box64_preset = Performance
env_vars = DXVK_STATE_CACHE=1 MESA_VK_WSI_PRESENT_MODE=mailbox
